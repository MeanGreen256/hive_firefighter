# The full cross-district journey, played in a browser against the production build.
#
# It lives outside `ci.yml` for one reason: CI has no GPU, so the game runs on
# Chrome's software rasterizer at a few frames a second, and a whole journey takes
# longer than every other gate put together. Pull requests get a production
# boot smoke; this runs on demand for release candidates and investigations.
name: Production journey (manual)

on:
  workflow_dispatch:
    inputs:
      incidents:
        description: 'How many calls of the cross-district journey to play'
        default: '3'

concurrency:
  group: production-shift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shift:
    name: cross-district journey
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately manual until the robot driver is deterministic.
      - name: Play the cross-district production journey
        run: npm run acceptance:production -- --incidents=${{ inputs.incidents || '3' }}
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/journey

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-shift
          path: artifacts/journey
          if-no-files-found: ignore
