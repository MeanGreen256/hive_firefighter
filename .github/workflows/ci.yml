name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Typecheck + lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Content, visual, and performance acceptance
        run: npm run acceptance
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/acceptance

      - name: Upload acceptance evidence when a gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-visual-performance-acceptance
          path: artifacts/acceptance
          if-no-files-found: ignore

      # The other half of acceptance (#219): a browser playing the built bundle
      # rather than posing it. One incident on every pull request, because a
      # software-rendered shift takes longer than the rest of CI put together;
      # the whole five-call shift runs nightly in `production-shift.yml`.
      #
      # Reporting, not blocking, until #239 is fixed. The first thing this gate
      # found is that an incident stays active for about seven minutes after
      # its last flame goes out, and every later step of the journey — the
      # quiet town, the next call, the refresh — is behind that star screen. So
      # today it cannot pass, for a reason that is the game's rather than the
      # pull request's, and blocking on it would only teach people to ignore a
      # red tick. Its assertions are unchanged and its evidence is uploaded
      # either way; the budgets are short so a known failure is quick.
      #
      # When #239 lands: delete `continue-on-error`, drop the two budget flags.
      - name: Production journey acceptance
        continue-on-error: true
        run: npm run acceptance:production -- --skip-build --incidents=1 --incident-seconds=300 --settle-seconds=120
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/journey

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-journey
          path: artifacts/journey
          if-no-files-found: ignore
