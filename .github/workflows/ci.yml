name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Typecheck + lint
        run: npm run check

      - name: Test
        run: npm test && npm run test:frame-pacing

      - name: Build
        run: npm run build

      - name: Check initial production bundle budget
        run: npm run budget:bundle

      - name: Content, visual, and performance acceptance
        run: npm run acceptance
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/acceptance

      - name: Upload acceptance evidence when a gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-visual-performance-acceptance
          path: artifacts/acceptance
          if-no-files-found: ignore

      # Boot the bundle a family downloads, not a development fixture. The
      # robot-driven journey is a manual release tool: at SwiftShader's 2–5 fps
      # it took 9–22 minutes and failed six consecutive PRs for unrelated
      # navigation/timing reasons. This keeps production startup, first frame,
      # browser errors, and first-interaction audio as a fast blocking gate.
      - name: Production build smoke
        run: npm run acceptance:production:smoke -- --skip-build
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/production-smoke

      - name: Production smoke with blocked browser storage
        run: npm run acceptance:production:smoke -- --skip-build --blocked-storage
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/production-smoke-blocked-storage

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke
          path: |
            artifacts/production-smoke
            artifacts/production-smoke-blocked-storage
          if-no-files-found: ignore
