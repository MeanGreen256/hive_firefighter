name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Typecheck + lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check initial production bundle budget
        run: npm run budget:bundle

      - name: Content, visual, and performance acceptance
        run: npm run acceptance
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/acceptance

      - name: Upload acceptance evidence when a gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-visual-performance-acceptance
          path: artifacts/acceptance
          if-no-files-found: ignore

      # The other half of acceptance (#219): a browser playing the built bundle
      # rather than posing it. One incident on every pull request, because a
      # software-rendered shift takes longer than the rest of CI put together;
      # the whole five-call shift runs nightly in `production-shift.yml`.
      #
      # Blocking: #239's containment, the held-key star-screen latch, and the
      # quiet-town "already in the cab after a refresh" resume are all in the
      # game now. A first-incident journey that cannot finish, keep its stars,
      # roam a fire-free town, or start the next call is a broken game.
      - name: Production journey acceptance
        run: npm run acceptance:production -- --skip-build --incidents=1
        env:
          ACCEPTANCE_ARTIFACT_DIR: artifacts/journey

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-journey
          path: artifacts/journey
          if-no-files-found: ignore
